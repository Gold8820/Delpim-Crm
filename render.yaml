# Blueprint do Render (opcional). Em "New > Blueprint" o Render lê este arquivo.
# Os segredos (DATABASE_URL) NÃO ficam aqui: são preenchidos no painel do Render.
# Não há login próprio: o acesso é pelo Cloudflare Access (CF_ACCESS_TEAM_DOMAIN e CF_ACCESS_AUD obrigatórias).
services:
  - type: web
    name: sistema-clientes
    runtime: python
    # Plano: escolha conforme o uso. "free" hiberna sem tráfego; "starter" mantém o serviço ativo.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: false          # não publica automaticamente a cada commit
    envVars:
      - key: DATABASE_URL      # conexão do Supabase (modo Transaction pooler, porta 6543)
        sync: false
      - key: CF_ACCESS_TEAM_DOMAIN   # <time>.cloudflareaccess.com
        sync: false
      - key: CF_ACCESS_AUD           # Application Audience (AUD) Tag
        sync: false
